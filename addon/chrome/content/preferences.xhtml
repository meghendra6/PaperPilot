        <html:select

          preference="extensions.zotero.__addonRef__.defaultMode"
          style="flex: 1"

            data-l10n-id="pref-general-default-mode-codex"

          <html:option

          <html:option

          <html:option value="max" data-l10n-id="pref-effort-max"></html:option>

        <html:select

          <html:option
