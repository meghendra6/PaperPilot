name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run lint:check

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Set up Python for notebook integration
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook test runtime
        run: python -m pip install jupyter-client ipykernel matplotlib

      - name: Test notebook worker
        run: python test/studio_kernel_worker_test.py

      - name: Build plugin
        run: npm run build
